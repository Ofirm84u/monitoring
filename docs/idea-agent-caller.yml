# Idea Runner — per-repo caller.
#
# Copy this to `.github/workflows/idea-agent.yml` in a target repo. It is the
# whole per-repo cost: the gate ladder itself lives once, in the monitoring
# repo, so fixing a gate does not mean editing fourteen files.
#
# Install, per repo:
#   1. Copy this file in as .github/workflows/idea-agent.yml
#   2. Add the repository secret AGENT_SECRET (the same value MonitoringApp has)
#   3. Add ANTHROPIC_API_KEY — only needed for real runs; a dry run works without
#   4. Give the project a `verify` contract in src/lib/projects.ts. Without one
#      G0 has nothing to measure and dispatch is refused. A real run additionally
#      needs `measured: true`, which a dry run is what establishes.
#
# This file must live on the repo's DEFAULT branch. `repository_dispatch` only
# triggers workflows there, and a caller on a feature branch simply never fires.
#
# No setting is needed on the monitoring repo: it is public, so its reusable
# workflows are callable as-is.

name: Idea Runner agent

on:
  repository_dispatch:
    types: [idea-agent]

jobs:
  agent:
    # While testing, point this at the branch the workflow lives on
    # (…/idea-agent.yml@feat/idea-runner) until it has merged to main.
    uses: Ofirm84u/monitoring/.github/workflows/idea-agent.yml@main
    with:
      run_id: ${{ github.event.client_payload.runId }}
      step_id: ${{ github.event.client_payload.stepId }}
      packet_token: ${{ github.event.client_payload.token }}
      packet_url: ${{ github.event.client_payload.packetUrl }}
      callback_url: ${{ github.event.client_payload.callbackUrl }}
      dry_run: ${{ github.event.client_payload.dryRun }}
    secrets:
      AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
      # Unset is fine for dry runs; the workflow fails with a clear message if a
      # real run reaches it without one.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
